# Install on the hosting right after a build (no Cron Job needed). Model: CamelliaSinensis.
# When "Objava" succeeds (a save in the admin or a push to main), this job calls the admin API on the hosting
# (/api/admin/osvjezi); it downloads the new "hosting" package from GitHub and installs it into public_html.
# The API asks GitHub at most once a minute ("pricekaj"), so the call repeats until it confirms.
# The route is public, but installs only successful builds of this repository (api/lib/publish.php).
name: Postavi
run-name: Postavi ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: [Objava]
    types: [completed]

permissions: {}

concurrency:
  group: postavi
  cancel-in-progress: false

jobs:
  postavi:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && vars.OBJAVA_UKLJUCENA == 'da'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Javi hostingu da je paket spreman
        env:
          ADRESA: ${{ vars.SITE_ORIGIN }}/api/admin/osvjezi
        run: |
          for i in $(seq 1 15); do
            odgovor=$(curl -s --max-time 90 "$ADRESA" || true)
            echo "pokušaj $i: $odgovor"
            case "$odgovor" in
              *'"postavljeno"'*|*'"aktualno"'*) exit 0 ;;
              *'"nije-postavljeno"'*) echo "::error::Administracija nema vezu s GitHubom (izbornik računa → Objava stranice)."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Hosting nije potvrdio postavljanje novog paketa."
          exit 1
